name: Update README stats

# 이 파일은 레포 안에 .github/workflows/update-readme.yml 로 저장해야 합니다.

on:
  push:
    branches: [main]
    paths:
      - "**/notes.md"        # notes.md가 추가/수정될 때만 실행
      - "update_readme.py"

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run update script
        run: python update_readme.py --root . --readme README.md

      - name: Commit changes if README updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "No changes to README.md"
          else
            git add README.md
            git commit -m "chore: auto-update README stats [skip ci]"
            git push
          fi